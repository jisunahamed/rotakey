<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The browser's own chrome follows the console's canvas. theme.js corrects
         this on load and the console corrects it again on every theme change; the
         attribute value is the light canvas so the markup is never momentarily
         wrong. -->
    <meta name="theme-color" content="#e9ebef" />
    <link rel="icon" href="/admin/favicon.svg" type="image/svg+xml" />
    <title>Rotakey</title>
    <!-- public/theme.js is injected above by vite.config.ts. It resolves the
         stored theme onto <html> before the stylesheets load, so the first paint
         is already the right colour. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

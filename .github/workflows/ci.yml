name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go tests and vet
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          go test -count=1 -race ./...
          go vet ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Admin UI
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm audit --audit-level=high
      - name: Compose validation
        env:
          POSTGRES_PASSWORD: ci-only-password
          APP_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          BOOTSTRAP_TOKEN: ci-bootstrap-token-at-least-24-characters
        run: docker compose config --quiet
      - name: Production image
        run: docker build --tag rotakey:ci .

  deploy:
    name: Deploy production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: rotakey-production
      cancel-in-progress: false
    steps:
      - name: Configure restricted SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.ROTAKEY_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ROTAKEY_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/rotakey_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rotakey_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/rotakey_deploy" >/dev/null

      - name: Deploy tested commit
        env:
          DEPLOY_HOST: ${{ secrets.ROTAKEY_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.ROTAKEY_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.ROTAKEY_DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          ssh \
            -F /dev/null \
            -i "$HOME/.ssh/rotakey_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $GITHUB_SHA"
